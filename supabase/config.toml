# GenoMatch — linked project: rxmrfazktupegpfxaljo
project_id = "rxmrfazktupegpfxaljo"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.migrations]
enabled = true

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323

[functions.delete-account]
verify_jwt = true

# Auth hooks — only enable AFTER migrations are applied on hosted Supabase.
# Dashboard → Authentication → Hooks (disable here if login breaks).
[auth.hook.before_user_created]
enabled = false
uri = "pg-functions://postgres/public/hook_before_user_created"

[auth.hook.custom_access_token]
enabled = false
uri = "pg-functions://postgres/public/hook_custom_access_token"
